name: OTA deploy to ESP32

# Запускається на self-hosted runner, що стоїть у тій самій Wi-Fi мережі, що й ESP32.
# Хмарні раннери GitHub не бачать локальну мережу, тому тут інакше не вийде.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/ota.yml"
  workflow_dispatch:

concurrency:
  group: ota-esp32
  cancel-in-progress: false

jobs:
  ota:
    # лише пуші власника: self-hosted runner виконує код на ПК
    if: github.actor == 'ganfay'
    runs-on: [self-hosted, linux, smartswitch]
    timeout-minutes: 15
    env:
      PIO: /home/maks/.platformio/penv/bin/pio
      SECRETS_FILE: /home/maks/.config/smartswitch/secrets.h
    steps:
      - uses: actions/checkout@v4

      - name: Підкласти secrets.h з ПК (у репозиторії його немає)
        run: cp "$SECRETS_FILE" src/secrets.h

      - name: Збірка
        run: $PIO run -e esp32dev

      - name: Бездротова прошивка по Wi-Fi (OTA)
        run: |
          BIN=".pio/build/esp32dev/firmware.bin"
          if curl -fsS -m 3 http://10.100.35.61/api/sys >/dev/null 2>&1; then
            echo "📡 ESP32 знайдено по Wi-Fi (10.100.35.61). Заливка прошивки без дротів..."
            curl -fsS --progress-bar --max-time 90 -F "firmware=@$BIN" http://10.100.35.61/update
            echo "✅ Бездротове оновлення завершено успішно!"
            exit 0
          elif curl -fsS -m 3 http://switch.local/api/sys >/dev/null 2>&1; then
            echo "📡 ESP32 знайдено по mDNS (switch.local). Заливка прошивки без дротів..."
            curl -fsS --progress-bar --max-time 90 -F "firmware=@$BIN" http://switch.local/update
            echo "✅ Бездротове оновлення завершено успішно!"
            exit 0
          elif [ -e /dev/ttyUSB0 ]; then
            echo "🔌 Wi-Fi не відповідає, знайдено резервний кабель USB. Заливка..."
            $PIO run -e esp32dev -t upload --upload-port /dev/ttyUSB0
            exit 0
          else
            echo "❌ ESP32 недоступний ні по Wi-Fi, ні по USB!"
            exit 1
          fi

      - name: Перевірка, що ESP32 піднялась
        run: |
          sleep 12
          for i in $(seq 1 10); do
            if curl -fsS -m 4 http://switch.local/api/sys; then echo; echo "ESP32 online"; exit 0; fi
            sleep 3
          done
          echo "ESP32 не відповідає після прошивки"; exit 1
