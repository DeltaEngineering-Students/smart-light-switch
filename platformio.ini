[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Бездротова прошивка: pio run -e esp32dev_ota -t upload
; Пароль береться зі змінної середовища OTA_PASS (CI дістає її з src/secrets.h)
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = switch.local
upload_flags =
    --auth=${sysenv.OTA_PASS}
